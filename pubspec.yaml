name: tallylive
description: "TallyLive（在播）—— 斗鱼/虎牙/抖音/bilibili 直播聚合客户端，夜间导播台风格。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 播放器内核：media_kit 底层是 libmpv，三端都能把视频合成进 Flutter 纹理，
  # 这是弹幕能自然叠在视频上的前提（WebView 架构做不到）。
  media_kit: ^1.2.2
  media_kit_video: ^2.0.0
  media_kit_libs_video: ^1.0.7

  # 网络
  dio: ^5.9.0

  # 斗鱼取流签名用 MD5（Go 版是 crypto/md5，Dart 需要这个包）
  crypto: ^3.0.6

  # 弹幕渲染
  canvas_danmaku: ^0.3.4

  # B 站弹幕 protover=3 用 brotli 压缩；不引入就只能丢弃这类帧
  brotli: ^0.6.0

  # 常用
  shared_preferences: ^2.3.2
  # 桌面真全屏（覆盖任务栏）：Windows/macOS/Linux 有效，移动端用 SystemChrome
  window_manager: ^0.4.3
  # 抖音弹幕签名：官方只提供混淆 JS（byted_acrawler），
  # 参考项目（DTV 的 goja / Simple Live 的 dart_quickjs）都是跑 JS，无法逆出算法。
  flutter_js: ^0.8.7
  # 扫码登录的二维码渲染
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/huya_categories.json
    - assets/douyin_categories.json
    - assets/douyin_sign.js