name: tallylive
description: "TallyLive（在播）—— 斗鱼/虎牙/抖音/bilibili 直播聚合客户端，夜间导播台风格。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 播放器内核：media_kit 底层是 libmpv，三端都能把视频合成进 Flutter 纹理，
  # 这是弹幕能自然叠在视频上的前提（WebView 架构做不到）。
  media_kit: ^1.2.2
  media_kit_video: ^2.0.0
  media_kit_libs_video: ^1.0.7

  # 网络
  dio: ^5.9.0

  # 弹幕渲染
  canvas_danmaku: ^0.2.7

  # 常用
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
