name: Flutter Build

# 当前阶段：**先只构建 Windows**，快速迭代验证功能。
# 安卓 / iOS 默认跳过，需要时手动把 build_all 勾上（或打 v* tag）。
#
# 产物：
#   - Windows: TallyLive-windows-x64.zip
#   - Android: TallyLive-android.apk
#   - iOS:     TallyLive-ios-unsigned.ipa（未签名，LiveContainer 安装）

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: '同时构建 Android + iOS（默认只构建 Windows）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: flutter-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  APP_ORG: com.tally

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Bootstrap platform folders
        shell: pwsh
        run: |
          # lib/ 与 pubspec.yaml 由仓库提供；平台脚手架由 flutter create 生成。
          flutter create . --platforms=windows,android,ios --org $env:APP_ORG --project-name tallylive
          flutter pub get

      - name: Analyze
        shell: pwsh
        run: flutter analyze --no-fatal-infos

      - name: Test
        shell: pwsh
        run: flutter test

      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release

      # 不再自己 Compress-Archive：upload-artifact 上传时本身就强制打包成 zip，
      # 再包一层会导致下载后需要解压两次。直接上传 Release 目录内容即可。
      - uses: actions/upload-artifact@v4
        with:
          name: TallyLive-windows
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error

  android:
    name: Android APK
    if: ${{ inputs.build_all == true || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Bootstrap platform folders
        run: |
          flutter create . --platforms=windows,android,ios --org $APP_ORG --project-name tallylive
          flutter pub get

      - name: Build APK
        run: |
          # 未配置 release keystore 时 Flutter 用 debug key 签名，可直接安装测试。
          flutter build apk --release

      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/TallyLive-android.apk
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: TallyLive-android
          path: artifacts/*.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    if: ${{ inputs.build_all == true || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Bootstrap platform folders
        run: |
          flutter create . --platforms=windows,android,ios --org $APP_ORG --project-name tallylive
          flutter pub get

      - name: Pod install
        working-directory: ios
        run: |
          # media_kit 在 iOS 上通过 CocoaPods 引入 libmpv 相关 framework。
          pod repo update || true
          pod install --repo-update || pod install

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }

          # 剥掉签名痕迹，产出真正未签名的包（LiveContainer 会自行处理）。
          codesign --remove-signature "$APP" 2>/dev/null || true
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "TallyLive-ios-unsigned.ipa" Payload
          rm -rf Payload

          mkdir -p artifacts
          mv "TallyLive-ios-unsigned.ipa" artifacts/
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: TallyLive-ios
          path: artifacts/*.ipa
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p out
          # Windows artifact 现在是 Release 目录的散文件，发布时打成 zip。
          if [ -d artifacts/TallyLive-windows ]; then
            (cd artifacts/TallyLive-windows && zip -qry ../../out/TallyLive-windows-x64.zip .)
          fi
          find artifacts -type f \( -name '*.apk' -o -name '*.ipa' \) -exec cp {} out/ \;
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
